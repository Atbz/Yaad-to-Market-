<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaad Market - Rebuild</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f4f6e8}
header{background:#0a4a1f;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header img{height:48px;width:48px;border-radius:50%;background:#fff;object-fit:cover}
button{background:#ffaa00;border:0;padding:9px 12px;border-radius:8px;font-weight:700;cursor:pointer;margin:3px;font-size:13px}
button.green{background:#0a4a1f;color:#fff}button.blue{background:#0066cc;color:#fff}button.red{background:#c00;color:#fff}
.card{background:#fff;border-radius:12px;padding:14px;margin:12px;box-shadow:0 2px 8px #0001}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{border:1px solid #eee;border-radius:10px;padding:10px}.prod img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.badge{background:#ffe9b0;padding:3px 8px;border-radius:20px;font-size:11px}
.hidden{display:none}.flex{display:flex;gap:8px;flex-wrap:wrap}
.cashbox{background:#fff8d6;border:2px solid #ffaa00;padding:12px;border-radius:10px}
.orderbox{border:2px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}
.stars{font-size:28px;cursor:pointer}.stars span{color:#ccc}.stars span.on{color:#ffaa00}
.timer{color:#c00;font-weight:700}.review{border-left:3px solid #ffaa00;padding:6px;margin:6px 0;background:#fff8e6}
.live{color:#0a0;font-weight:700}
</style></head><body>

<header><div style="display:flex;align-items:center;gap:10px"><img src="logo.png"><b>Yaad Market KINGSTON - LIVE</b></div><span id="userLabel">Guest</span><button id="loginBtn" onclick="show('auth')">Login</button></header>
  
<!-- CUSTOMER VIEW -->
<div id="customerView" class="card hidden">
  <h2>Welcome Customer - <span id="custName"></span></h2>
  <p>You will see: Markets > Vendors > Goods here in Step 3.</p>
  <p id="custDebug"></p>
</div>

<!-- VENDOR VIEW -->
<div id="vendorView" class="card hidden">
  <h2>Welcome Vendor - <span id="vendorName"></span></h2>
  <p>Market: <span id="vendorMarket"></span></p>
  <p>You will see: Your Goods + Orders + Cash + Reviews here in Step 2.</p>
  <p id="vendorDebug"></p>
</div>

<div id="loginSection" style="padding:20px; background:#fff; border-radius:12px; margin:10px;">
  <h3>Login</h3>
  <p id="loginMsg" style="color:red;"></p>

  <label>Role</label><br>
  <select id="loginRole" style="width:100%; padding:10px; margin-bottom:10px;">
    <option value="Customer">Customer</option>
    <option value="Vendor">Vendor</option>
  </select><br>

  <label>Username</label><br>
  <input id="loginUser" type="text" placeholder="Username" style="width:100%; padding:10px; margin-bottom:10px;"><br>

  <label>Password</label><br>
  <input id="loginPass" type="password" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px;"><br>

  <label>WhatsApp</label><br>
  <input id="loginWhats" type="text" placeholder="8765550100" style="width:100%; padding:10px; margin-bottom:10px;"><br>

  <label>Market</label><br>
  <select id="loginMarket" style="width:100%; padding:10px; margin-bottom:10px;">
    <option>Coronation Market</option>
    <option>Other Market</option>
  </select><br>

  <label>Vendor TRN / ID</label><br>
  <input id="loginTRN" type="text" placeholder="TEST123" style="width:100%; padding:10px; margin-bottom:10px;"><br>

  <button onclick="createAccount()" style="width:100%; padding:12px; background:#f97316; color:#fff; border:none; border-radius:8px; margin-bottom:10px; font-weight:bold;">Create Account</button>
  <button onclick="loginUser()" style="width:100%; padding:12px; background:#16a34a; color:#fff; border:none; border-radius:8px; font-weight:bold;">Login</button>
  <button onclick="logoutUser()" style="width:100%; padding:10px; background:#eee; border:none; border-radius:8px; margin-top:10px;">Logout</button>
</div>

<script>
function createAccount() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  var role = document.getElementById('loginRole').value;
  var whats = document.getElementById('loginWhats').value.trim();
  var market = document.getElementById('loginMarket').value;
  var trn = document.getElementById('loginTRN').value.trim();
  var msg = document.getElementById('loginMsg');

  if (!user || !pass) {
    msg.style.color = 'red';
    msg.innerText = 'Please enter Username and Password';
    return;
  }
  if (pass.length < 4) {
    msg.style.color = 'red';
    msg.innerText = 'Password must be at least 4 characters';
    return;
  }
  var key = 'user_' + user.toLowerCase();
  if (localStorage.getItem(key)) {
    msg.style.color = 'red';
    msg.innerText = 'That username is already taken, try another one';
    return;
  }

  var account = { user: user, pass: pass, role: role, whats: whats, market: market, trn: trn };
  localStorage.setItem(key, JSON.stringify(account));
  localStorage.setItem('loggedInUser', JSON.stringify(account));

  msg.style.color = 'green';
  msg.innerText = 'Account created! You are now logged in as ' + user;
  updateLoginDisplay();
  alert('Account created for ' + user + ' as ' + role);
}

function loginUser() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  var msg = document.getElementById('loginMsg');

  var saved = localStorage.getItem('user_' + user.toLowerCase());
  if (!saved) {
    msg.style.color = 'red';
    msg.innerText = 'No account found. Tap Create Account first.';
    return;
  }
  var account = JSON.parse(saved);
  if (account.pass !== pass) {
    msg.style.color = 'red';
    msg.innerText = 'Wrong password';
    return;
  }
  localStorage.setItem('loggedInUser', JSON.stringify(account));
  msg.style.color = 'green';
  msg.innerText = 'Welcome back ' + user;
  updateLoginDisplay();
  alert('Logged in as ' + user);
}

function logoutUser() {
  localStorage.removeItem('loggedInUser');
  document.getElementById('loginMsg').innerText = 'Logged out';
  updateLoginDisplay();
}

function updateLoginDisplay() {
  var saved = localStorage.getItem('loggedInUser');
  if (!saved) return;
  var account = JSON.parse(saved);
  // This updates the Guest text at the top and Vendor Dashboard name
  var all = document.body.innerHTML;
  // Update any element that says Guest
  var guestEls = document.querySelectorAll('*');
  guestEls.forEach(function(el){
    if(el.children.length === 0 && el.innerText === 'Guest'){
      el.innerText = account.user;
    }
  });
  var dash = document.getElementById('vendorName');
  if (dash) dash.innerText = account.user;
}
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBLGA_B9rwMh_tllJ2dGJbf3duo9ZrTOgM",
  authDomain: "yaad-to-market-kngst.firebaseapp.com",
  databaseURL: "https://yaad-to-market-kngst-default-rtdb.firebaseio.com",
  projectId: "yaad-to-market-kngst",
  storageBucket: "yaad-to-market-kngst.firebasestorage.app",
  messagingSenderId: "209573811332",
  appId: "1:209573811332:web:37a9ef4fe63c3615eb1ed1"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
  const db = firebase.datavase();
  const fs = firesbase.firestore();
const rtdb = firebase.database();
const fsdb = firebase.firestore();

function showAuth(){ document.getElementById('authBox').classList.remove('hidden'); }

async function signup(){
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  const role = document.getElementById('role').value;
  const market = document.getElementById('market').value;
  const phone = document.getElementById('phone').value;
  if(!name || !email || pass.length < 6) return alert('Name + Email + 6 char password');
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.ref('users/' + cred.user.uid).set({ name, email, role, market, phone, cashCollected: 0, ordersCompleted: 0, createdAt: Date.now() });
    loadUser(cred.user.uid);
  }catch(e){ alert(e.message); }
}
  async function createAccount() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  var role = document.getElementById('loginRole').value;
  var whats = document.getElementById('loginWhats').value.trim();
  var market = document.getElementById('loginMarket').value;
  var trn = document.getElementById('loginTRN').value.trim();
  var msg = document.getElementById('loginMsg');

  if (!user || !pass) { msg.innerText = 'Please enter Username and Password'; return; }
  if (pass.length < 4) { msg.innerText = 'Password must be at least 4 characters'; return; }

  // Turn username into an email Firebase will accept
  // Test Vendor -> testvendor@yaad.local
  var email = user.toLowerCase().replace(/\s+/g,'') + '@yaad.local';

  try{
    var cred = await auth.createUserWithEmailAndPassword(email, pass);
    var uid = cred.user.uid;
    var profile = { name: user, email: email, role: role, whats: whats, market: market, trn: trn };

    await db.ref('users/' + uid).set(profile);
    await fs.collection('users').doc(uid).set(profile);

    msg.style.color = 'green';
    msg.innerText = 'Account created! You are now logged in as ' + user;
    showVendorPage(profile);
  } catch(e){ msg.innerText = e.message; }
}

async function loginUser() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  var msg = document.getElementById('loginMsg');

  var email = user.toLowerCase().replace(/\s+/g,'') + '@yaad.local';

  try{
    var cred = await auth.signInWithEmailAndPassword(email, pass);
    var uid = cred.user.uid;

    // Load profile from Firestore, fallback to RTDB
    var profile = null;
    try{
      var doc = await fs.collection('users').doc(uid).get();
      if(doc.exists) profile = doc.data();
    }catch(e){}
    if(!profile){
      var snap = await db.ref('users/' + uid).once('value');
      if(snap.exists()) profile = snap.val();
    }
    if(!profile) profile = { name: user, email: email, role: document.getElementById('loginRole').value };

    msg.style.color = 'green';
    msg.innerText = 'Welcome back ' + profile.name;
    showVendorPage(profile);
  } catch(e){ msg.innerText = e.message; }
}

function showVendorPage(profile){
  var authBox = document.getElementById('loginSection');
  if(authBox) authBox.classList.add('hidden');
  // Change Guest text at top
  document.querySelectorAll('*').forEach(function(el){
    if(el.children.length === 0 && el.innerText === 'Guest') el.innerText = profile.name;
  });
  var dash = document.getElementById('vendorName');
  if(dash) dash.innerText = profile.name;
  // Show vendor view if it exists
  var v = document.getElementById('vendorView');
  if(v) v.classList.remove('hidden');
  var b = document.getElementById('buyerView');
  if(b && profile.role !== 'Vendor') b.classList.remove('hidden');
}

function logoutUser() {
  auth.signOut();
  document.getElementById('loginMsg').innerText = 'Logged out';
  location.reload();
}

async function login(){
  const email = document.getElementById('email').value.trim();
  alert("Email I am sending to Firebase: [" + email + ");
        //...rest
  const pass = document.getElementById('pass').value;
  try{
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    loadUser(cred.user.uid);
  }catch(e){ alert(e.message); }
}

async function loadUser(uid){
  const snap = await db.ref('users/' + uid).once('value');
  const user = snap.val();
  if(!user) return alert('User profile not found');
  document.getElementById('userLabel').innerText = user.name + ' (' + user.role + ')';
  document.getElementById('loginBtn').innerText = 'Logout';
  document.getElementById('loginBtn').onclick = () => auth.signOut().then(()=>location.reload());
  document.getElementById('authBox').classList.add('hidden');

  if(user.role === 'vendor'){
    document.getElementById('vendorView').classList.remove('hidden');
    document.getElementById('vendorName').innerText = user.name;
    document.getElementById('vendorMarket').innerText = user.market;
    document.getElementById('vendorDebug').innerText = 'UID: ' + uid + ' | Role check PASSED - Vendor only';
  } else {
    document.getElementById('customerView').classList.remove('hidden');
    document.getElementById('custName').innerText = user.name;
    document.getElementById('custDebug').innerText = 'UID: ' + uid + ' | Role check PASSED - Customer only';
  }
}

auth.onAuthStateChanged(u => { if(u) loadUser(u.uid); });
</script></body></html>
