<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaad Market - Rebuild</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f4f6e8}
header{background:#0a4a1f;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header img{height:48px;width:48px;border-radius:50%;background:#fff;object-fit:cover}
button{background:#ffaa00;border:0;padding:9px 12px;border-radius:8px;font-weight:700;cursor:pointer;margin:3px;font-size:13px}
button.green{background:#0a4a1f;color:#fff}button.blue{background:#0066cc;color:#fff}button.red{background:#c00;color:#fff}
.card{background:#fff;border-radius:12px;padding:14px;margin:12px;box-shadow:0 2px 8px #0001}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{border:1px solid #eee;border-radius:10px;padding:10px}.prod img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.badge{background:#ffe9b0;padding:3px 8px;border-radius:20px;font-size:11px}
.hidden{display:none}.flex{display:flex;gap:8px;flex-wrap:wrap}
.cashbox{background:#fff8d6;border:2px solid #ffaa00;padding:12px;border-radius:10px}
.orderbox{border:2px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}
.stars{font-size:28px;cursor:pointer}.stars span{color:#ccc}.stars span.on{color:#ffaa00}
.timer{color:#c00;font-weight:700}.review{border-left:3px solid #ffaa00;padding:6px;margin:6px 0;background:#fff8e6}
.live{color:#0a0;font-weight:700}
</style></head><body>

<header><div style="display:flex;align-items:center;gap:10px"><img src="logo.png"><b>Yaad Market KINGSTON - LIVE</b></div><span id="userLabel">Guest</span><button id="loginBtn" onclick="show('auth')">Login</button></header>
  
<!-- CUSTOMER VIEW -->
<div id="customerView" class="card hidden">
  <h2>Welcome Customer - <span id="custName"></span></h2>
  <p>You will see: Markets > Vendors > Goods here in Step 3.</p>
  <p id="custDebug"></p>
</div>

</div>
<!-- VENDOR ADD GOODS - FIX -->
<div id="vendorAddBox" style="padding:20px; background:#fff7ed; border:2px solid #f97316; border-radius:12px; margin:10px;">
  <h3>Add Goods - Vendor Only</h3>
  <p>You are logged in as <b id="vendorAddName">Vendor</b></p>
  <input id="prodName" type="text" placeholder="Product Name e.g. Test Banana" style="width:100%; padding:10px; margin-bottom:10px;"><br>
  <input id="prodPrice" type="number" placeholder="Price J$ 500" style="width:100%; padding:10px; margin-bottom:10px;"><br>
  <input id="prodStock" type="number" placeholder="Stock 10" style="width:100%; padding:10px; margin-bottom:10px;"><br>
  <button onclick="addVendorProduct()" style="width:100%; padding:12px; background:#f97316; color:#fff; border:none; border-radius:8px; font-weight:bold;">Add Product to Shop</button>
  <p id="prodMsg" style="color:green;"></p>
</div>

<script>
function addVendorProduct(){
  var name = document.getElementById('proName').value.trim();
  var price = document.getElementById('proPrice').value.trim();
  var stock = document.getElementById('proStock').value.trim();
  var acc = JSON.parse(localStorage.getItem('loggedInUser') || 'null');
  if(!acc){ alert('Login as Vendor first'); return; }
  if(!name || !price){ alert('Enter Name and Price'); return; }
  var products = JSON.parse(localStorage.getItem('shopProducts') || '[]');
  products.push({ name:name, price:price, stock:stock, vendor:acc.user, market:acc.market || 'Kingston' });
  localStorage.setItem('shopProducts', JSON.stringify(products));
  document.getElementById('proName').value = '';
  document.getElementById('proPrice').value = '';
  document.getElementById('proStock').value = '';
  renderVendorProducts(); render();
}
function editVendorProduct(i){
  var products = JSON.parse(localStorage.getItem('shopProducts') || '[]');
  var p = products[i];
  var np = prompt('Edit price for ' + p.name + ' (JMD)', p.price); if(np === null) return;
  var ns = prompt('Edit stock for ' + p.name, p.stock); if(ns === null) return;
  p.price = np; p.stock = ns;
  localStorage.setItem('shopProducts', JSON.stringify(products));
  renderVendorProducts(); render();
}
function deleteVendorProduct(i){
  if(!confirm('Delete this good?')) return;
  var products = JSON.parse(localStorage.getItem('shopProducts') || '[]');
  products.splice(i, 1);
  localStorage.setItem('shopProducts', JSON.stringify(products));
  renderVendorProducts(); render();
}

// Make the old Vendor Dashboard button also scroll to this box
document.querySelectorAll('button, a').forEach(function(b){
  if(b.innerText.trim() === 'Vendor Dashboard'){
    b.onclick = function(){
      document.getElementById('vendorAddBox').scrollIntoView({behavior:'smooth'});
    };
  }
});

// Hide this box if NOT a vendor, show if vendor
window.addEventListener('load', function(){
  var saved = localStorage.getItem('loggedInUser');
  var box = document.getElementById('vendorAddBox');
  if(!saved){ if(box) box.style.display='none'; return; }
  var acc = JSON.parse(saved);
  if(acc.role !== 'Vendor'){ if(box) box.style.display='none'; }
  else {
    if(box) box.style.display='block';
    var n = document.getElementById('vendorAddName');
    if(n) n.innerText = acc.user;
  }
});
<!-- LOGIN / SIGNUP -->
<div id="authBox" class="card">
  <h2>Login / Create Account</h2>
  <input id="name" placeholder="Your Name">
  <input id="email" placeholder="Email - e.g. mavis@gmail.com">
  <input id="pass" type="password" placeholder="Password - 6+ chars">
  <select id="role"><option value="customer">I am a Customer</option><option value="vendor">I am a Vendor</option></select>
  <select id="market">
    <option>Coronation Market</option><option>Cross Roads Market</option>
    <option>Papine Market</option><option>Constant Spring Market</option><option>Half Way Tree Market</option>
  </select>
  <input id="phone" placeholder="WhatsApp e.g 8765550100">
  <button onclick="signup()">Create Account</button>
  <button onclick="login()" style="background:#0a4a1f;color:#fff">Login</button>
  <p id="authMsg"></p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBLGA_B9rwMh_tllJ2dGJbf3duo9ZrTOgM",
  authDomain: "yaad-to-market-kngst.firebaseapp.com",
  databaseURL: "https://yaad-to-market-kngst-default-rtdb.firebaseio.com",
  projectId: "yaad-to-market-kngst",
  storageBucket: "yaad-to-market-kngst.firebasestorage.app",
  messagingSenderId: "209573811332",
  appId: "1:209573811332:web:37a9ef4fe63c3615eb1ed1"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const fdb = firebase.firestore();

function showAuth(){ document.getElementById('authBox').classList.remove('hidden'); }

async function signup(){
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  const role = document.getElementById('role').value;
  const market = document.getElementById('market').value;
  const phone = document.getElementById('phone').value;
  if(!name || !email || pass.length < 6) return alert('Name + Email + 6 char password');
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.ref('users/' + cred.user.uid).set({ name, email, role, market, phone, cashCollected: 0, ordersCompleted: 0, createdAt: Date.now() });
    loadUser(cred.user.uid);
  }catch(e){ alert(e.message); }
}

async function login(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  try{
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    loadUser(cred.user.uid);
  }catch(e){ alert(e.message); }
}

async function loadUser(uid){
  const snap = await db.ref('users/' + uid).once('value');
  let user = snap.val();

  // FIX: If Auth exists but profile is missing, rebuild it from the form instead of failing
  if(!user){
    const name = document.getElementById('name').value || 'Test Vendor';
    const email = document.getElementById('email').value || 'vendor@test.com';
    const role = document.getElementById('role').value || 'vendor';
    const market = document.getElementById('market').value || 'Coronation Market';
    const phone = document.getElementById('phone').value || '';
    user = { name: name, email: email, role: role, market: market, phone: phone, cashCollected: 0 };
    try{
      await db.ref('users/' + uid).set(user);
    }catch(e){ alert('Could not save profile: ' + e.message); return; }
  }

  document.getElementById('userLabel').innerText = user.name + ' (' + user.role + ')';
  document.getElementById('loginBtn').innerText = 'Logout';
  document.getElementById('loginBtn').onclick = () => auth.signOut().then(()=>location.reload());
  document.getElementById('authBox').classList.add('hidden');

  if(user.role === 'vendor'){
    document.getElementById('vendorView').classList.remove('hidden');
    document.getElementById('vendorName').innerText = user.name;
    document.getElementById('vendorMarket').innerText = user.market;
    document.getElementById('vendorDebug').innerText = 'UID: ' + uid + ' | Role check PASSED - Vendor';
  } else {
    document.getElementById('customerView').classList.remove('hidden');
    document.getElementById('custName').innerText = user.name;
    document.getElementById('custDebug').innerText = 'UID: ' + uid + ' | Role check PASSED - Customer';
  }
}
  function changeMarket(){
    const m = document.getElementById('vendorMarketSelect').value;
    document.getElementById('vendorMarket').innerText = m;
  }
  
async function addGood(){
  const name = document.getElementById('goodName').value.trim();
  const price = document.getElementById('goodPrice').value;
  const qty = document.getElementById('goodQty').value;
  const list = document.getElementById('goodsList');
  if(!name || !price || qty){ alert ('Add name and price'); return; }
  const user = auth.currentUser;
  if(!user){ alert ('Not logged in'); return; }
  await db.ref('goods/' + user.uid).push({ name: name, price: Number(price), qty: Number(qty || 0), createdAt: Date.now() });
  document.getElementById('goodName').value = '';
  document.getElementById('goodPrice').value = '';
  document.getElementById('goodQty').value = '';
  loadVendorGoods();
}

async function loadVendorGoods(){
  const user = auth.currentUser;
  if(!user) return;
  const list = document.getElementById('goodsList');
  if(!list) return;
  const snap = await db.ref('goods/' + user.uid).once('value');
  const goods = snap.val() || {};
  let html = '';
  for(let id in goods){
    html += '<p>' + goods[id].name + ' - $' + goods[id].price + ' (Qty: ' + goods[id].qty + ')</p>';
  }
  list.innerHTML = html || '<p>No goods yet.</p>';
}

auth.onAuthStateChanged(function(user){
  if(user){
    setTimeout(loadVendorGoods, 500);
  }
});
auth.onAuthStateChanged(u => { if(u) loadUser(u.uid); });
</script></body></html>
